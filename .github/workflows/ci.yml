name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25", "27"]
    steps:
      - uses: actions/checkout@v4
      # Gradle itself cannot run on Java 27 yet
      # (https://docs.gradle.org/current/userguide/compatibility.html).
      # Install Temurin 21 for the daemon, plus the matrix JDK for tests.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle --no-daemon test -PtestJavaVersion=${{ matrix.java }}
