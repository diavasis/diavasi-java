plugins {
    id "java"
    id "application"
    id "com.google.protobuf" version "0.9.4"
    id "com.vanniktech.maven.publish" version "0.30.0"
}

repositories {
    mavenCentral()
}

group = "io.github.diavasis"
version = "0.1.0"

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

application {
    mainClass = "dev.diavasi.client.Consume"
}

dependencies {
    implementation "io.grpc:grpc-netty-shaded:1.68.1"
    implementation "io.grpc:grpc-protobuf:1.68.1"
    implementation "io.grpc:grpc-stub:1.68.1"
    compileOnly "org.apache.tomcat:annotations-api:6.0.53"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testImplementation "io.grpc:grpc-inprocess:1.68.1"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

protobuf {
    protoc { artifact = "com.google.protobuf:protoc:3.25.5" }
    plugins {
        grpc { artifact = "io.grpc:protoc-gen-grpc-java:1.68.1" }
    }
    generateProtoTasks {
        all().configureEach { task ->
            task.plugins { grpc {} }
        }
    }
}

sourceSets.main.proto {
    srcDir "proto"
    include "data.proto"
}

mavenPublishing {
    // 0.30.0 defaults to legacy OSSRH; Portal-only accounts get HTTP 402 from stagingProfiles.
    publishToMavenCentral(com.vanniktech.maven.publish.SonatypeHost.CENTRAL_PORTAL, true)
    signAllPublications()
    coordinates("io.github.diavasis", "diavasi-client", "0.1.0")
    pom {
        name = "diavasi-client"
        description = "Thin client for the Diavasi data plane"
        url = "https://github.com/diavasis/diavasi-java"
        licenses {
            license {
                name = "The Apache License, Version 2.0"
                url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
            }
        }
        developers {
            developer {
                id = "diavasis"
                name = "diavasis"
            }
        }
        scm {
            url = "https://github.com/diavasis/diavasi-java"
            connection = "scm:git:https://github.com/diavasis/diavasi-java.git"
            developerConnection = "scm:git:ssh://git@github.com/diavasis/diavasi-java.git"
        }
    }
}

test {
    useJUnitPlatform()
    def testJavaVersion = providers.gradleProperty("testJavaVersion")
    if (testJavaVersion.isPresent()) {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(testJavaVersion.get())
        }
    }
}
